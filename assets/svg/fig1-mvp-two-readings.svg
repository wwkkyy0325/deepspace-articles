<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="250" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#8a3a3a"><tspan x="250" dy="0">误解：每个功能都缩水</tspan></text>
<text x="750" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#2f6b3a"><tspan x="750" dy="0">正确：先买最关键的信息</tspan></text>
<line x1="500" y1="70" x2="500" y2="380" stroke="#dddddd" stroke-width="2"/>
<rect x="35" y="100" width="100" height="78" rx="12" fill="#f6eeee" stroke="#b06a6a" stroke-width="2" stroke-dasharray="6 5"/><text x="85.0" y="128.6" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#8a3a3a"><tspan x="85.0" dy="0">功能 A</tspan><tspan x="85.0" dy="20.8">做一点</tspan></text>
<rect x="150" y="100" width="100" height="78" rx="12" fill="#f6eeee" stroke="#b06a6a" stroke-width="2" stroke-dasharray="6 5"/><text x="200.0" y="128.6" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#8a3a3a"><tspan x="200.0" dy="0">功能 B</tspan><tspan x="200.0" dy="20.8">做一点</tspan></text>
<rect x="265" y="100" width="100" height="78" rx="12" fill="#f6eeee" stroke="#b06a6a" stroke-width="2" stroke-dasharray="6 5"/><text x="315.0" y="128.6" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#8a3a3a"><tspan x="315.0" dy="0">功能 C</tspan><tspan x="315.0" dy="20.8">做一点</tspan></text>
<rect x="380" y="100" width="100" height="78" rx="12" fill="#f6eeee" stroke="#b06a6a" stroke-width="2" stroke-dasharray="6 5"/><text x="430.0" y="128.6" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#8a3a3a"><tspan x="430.0" dy="0">功能 D</tspan><tspan x="430.0" dy="20.8">做一点</tspan></text>
<text x="250" y="221.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#8a3a3a"><tspan x="250" dy="0">每个都做浅</tspan><tspan x="250" dy="28">结果：什么都没验证</tspan></text>
<rect x="550" y="100" width="180" height="56" rx="12" fill="#ffffff" stroke="#888888" stroke-width="2"/><text x="640.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#222222"><tspan x="640.0" dy="0">最难的假设</tspan></text>
<line x1="730" y1="128" x2="780" y2="128" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="100" width="160" height="56" rx="12" fill="#eef4ee" stroke="#5a8a5a" stroke-width="2"/><text x="860.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#2f6b3a"><tspan x="860.0" dy="0">最小验证</tspan></text>
<rect x="550" y="180" width="180" height="56" rx="12" fill="#ffffff" stroke="#888888" stroke-width="2"/><text x="640.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#222222"><tspan x="640.0" dy="0">争议点</tspan></text>
<line x1="730" y1="208" x2="780" y2="208" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="180" width="160" height="56" rx="12" fill="#eef4ee" stroke="#5a8a5a" stroke-width="2"/><text x="860.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#2f6b3a"><tspan x="860.0" dy="0">两个对照</tspan></text>
<rect x="550" y="260" width="180" height="56" rx="12" fill="#ffffff" stroke="#888888" stroke-width="2"/><text x="640.0" y="288.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#222222"><tspan x="640.0" dy="0">集成风险</tspan></text>
<line x1="730" y1="288" x2="780" y2="288" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="260" width="160" height="56" rx="12" fill="#eef4ee" stroke="#5a8a5a" stroke-width="2"/><text x="860.0" y="288.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#2f6b3a"><tspan x="860.0" dy="0">最薄切片</tspan></text>
<text x="750" y="360.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" fill="#2f6b3a"><tspan x="750" dy="0">结果：关键不确定性被消除</tspan></text>
<text x="500" y="405.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#444444"><tspan x="500" dy="0">MVP 买的不是功能数量，而是信息</tspan></text>
</svg>
