<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="250" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#8a3a3a"><tspan x="250" dy="0">攒到最后：一次大提交</tspan></text>
<text x="750" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#2f6b3a"><tspan x="750" dy="0">小步提交：一次一个关注点</tspan></text>
<line x1="500" y1="70" x2="500" y2="345" stroke="#dddddd" stroke-width="2"/>
<line x1="70" y1="180" x2="440" y2="180" stroke="#999999" stroke-width="3"/>
<circle cx="420" cy="180" r="13" fill="#b06a6a"/>
<text x="400" y="145.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" fill="#8a3a3a"><tspan x="400" dy="0">一次提交</tspan></text>
<text x="250" y="225.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#666666"><tspan x="250" dy="0">开发数周</tspan></text>
<text x="250" y="256.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#8a3a3a"><tspan x="250" dy="0">出问题 → 只能整体回退</tspan><tspan x="250" dy="28">无法用 bisect 定位</tspan></text>
<line x1="540" y1="180" x2="940" y2="180" stroke="#999999" stroke-width="3"/>
<circle cx="560" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="610" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="660" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="710" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="760" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="810" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="860" cy="180" r="8" fill="#5a8a5a"/>
<circle cx="910" cy="180" r="8" fill="#5a8a5a"/>
<text x="740" y="135.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#2f6b3a"><tspan x="740" dy="0">每次提交 = 一个关注点 + 一次验证</tspan></text>
<text x="740" y="225.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#666666"><tspan x="740" dy="0">每个点都是已知可用状态</tspan></text>
<text x="740" y="256.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#2f6b3a"><tspan x="740" dy="0">坏了回退一个点</tspan><tspan x="740" dy="28">bisect 能快速定位</tspan></text>
<text x="500" y="330.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#444444"><tspan x="500" dy="0">差别不在提交次数，而在每个提交是否可独立验证、独立回滚</tspan></text>
</svg>
